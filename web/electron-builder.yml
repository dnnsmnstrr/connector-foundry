appId: com.connectorfoundry.desktop
productName: Connector Foundry
asar: true
npmRebuild: false
directories:
  output: release
toolsets:
  # electron-builder's unified NSIS bundle (makensis 3.12 with its plugins)
  # ships a native compiler for every host, Apple Silicon included; the
  # legacy default is x86_64-only on macOS and fails without Rosetta.
  nsis: '1.2.1'
files:
  - dist/**/*
  - desktop/*.cjs
  - package.json
  - '!node_modules/**/*'
extraResources:
  - from: ../LICENSE
    to: LICENSE
  - from: ../README.md
    to: SOURCE-README.md
mac:
  icon: desktop/generated/icon.icns
  # Local builds must not silently select a certificate from the user's keychain.
  # Override explicitly with --config.mac.identity='Developer ID Application: …'
  # when producing a signed release.
  identity: '-'
  category: public.app-category.graphics-design
  target:
    - target: dmg
    - target: zip
  hardenedRuntime: true
  # Chromium locale packs are data, sealed by the enclosing framework signature.
  # Signing each as if it were executable adds hundreds of needless codesign calls.
  signIgnore:
    - '\.pak$'
  entitlements: desktop/entitlements.mac.plist
  entitlementsInherit: desktop/entitlements.mac.plist
  # Release builds override this with fixed, versionless names (desktop.yml).
  artifactName: 'Connector-Foundry-${version}-mac-${arch}.${ext}'
dmg:
  title: Connector Foundry
win:
  icon: desktop/generated/icon.ico
  # No certificate: SmartScreen warns once per download (the release notes say
  # what to click). For a signed release point electron-builder at one with
  # CSC_LINK/CSC_KEY_PASSWORD or the azureSignOptions, never a file here.
  target:
    - target: nsis
  # Release builds override this with fixed, versionless names (desktop.yml).
  artifactName: 'Connector-Foundry-${version}-win-${arch}-setup.${ext}'
nsis:
  # An assisted installer: a Next button, a folder choice, no admin prompt.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Connector Foundry
  uninstallDisplayName: Connector Foundry
  # Preferences and presets outlive an uninstall, like the macOS app's do.
  deleteAppDataOnUninstall: false
