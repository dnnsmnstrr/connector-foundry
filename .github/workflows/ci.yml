name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenSCAD (nightly, Manifold backend)
        run: |
          sudo add-apt-repository -y ppa:openscad/releases
          sudo apt-get update
          sudo apt-get install -y openscad
          openscad --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch reference sources
        # Submodule-backed references (gridfinity, GoPro, openGrid) are
        # already present from the checkout. This pulls the ones that are
        # deliberately NOT vendored because their licences cannot be
        # redistributed from an MIT repo — see references.yaml.
        run: python tools/refcache.py

      - name: Render + validate whole catalogue
        run: pytest tests/ -v

      - name: Reference + fit report
        # Same checks pytest just ran, printed as the report so a failure
        # shows the measured numbers and not just an assertion.
        if: always()
        run: python tools/verify.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The bundler reads vendor/ — the browser compiles the same
          # upstream sources the CLI does.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
