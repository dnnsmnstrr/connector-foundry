name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "lib/**"
      - "parts/**"
      - "assemblies/**"
      - "catalogue.yaml"
      - "vendor/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      # The same gate CI's web checks apply: a deploy straight from main
      # must not publish a build whose unit tests or lint fail.
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      # Pages deployments occasionally stall on GitHub's side: on
      # 2026-10-14 a green build timed out in this step ("Timeout reached,
      # aborting!") with the action's default of 10 minutes. Give the first
      # attempt 20 minutes, and try once more if it still fails; the second
      # attempt reuses the artifact the build job uploaded, so nothing is
      # rebuilt. The environment URL comes from whichever attempt succeeded.
      #
      # continue-on-error keeps a failed first attempt from failing the
      # job, so a successful retry leaves the run green; the step's
      # `outcome` still says failure (its `conclusion` is what becomes
      # success), which is what the retry keys on — not failure(), which
      # is false once the error has been swallowed. If the retry fails
      # too, the job fails on it.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: "1200000"
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: "1200000"
