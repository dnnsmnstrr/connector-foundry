name: Desktop app

# Manual runs build and test the macOS app and keep it as a workflow artifact.
# Pushing a version tag (v0.1.0, matching web/package.json) additionally
# publishes the DMG and ZIP for both architectures as a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
            # GPU-less VM: no WebGL, so the desktop test skips slot placement.
            allow-no-webgl: '1'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match web/package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run desktop:dist -- --${{ matrix.arch }}
      - name: Test packaged app
        env:
          DESKTOP_ALLOW_NO_WEBGL: ${{ matrix.allow-no-webgl }}
        run: |
          executables=(release/mac*/Connector\ Foundry.app/Contents/MacOS/Connector\ Foundry)
          DESKTOP_EXECUTABLE="$PWD/${executables[0]}" npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: connector-foundry-macos-${{ matrix.arch }}
          path: |
            web/release/*.dmg
            web/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-foundry-macos-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg *.zip > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Connector Foundry for macOS

          Download the DMG for your Mac: **arm64** for Apple Silicon (M1 and later),
          **x64** for Intel. The ZIP files contain the same app.

          These builds are not notarized by Apple. On first launch macOS will refuse
          to open the app: open **System Settings → Privacy & Security**, scroll down
          and click **Open Anyway** next to the Connector Foundry message. This is
          only needed once. Verify downloads against `SHA256SUMS.txt`.

          The web version runs at https://dnnsmnstrr.github.io/connector-foundry/.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Connector Foundry $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
