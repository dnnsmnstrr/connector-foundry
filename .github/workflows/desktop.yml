name: Desktop app

# Manual runs build and test the macOS and Windows apps and keep the DMGs, ZIPs
# and installer as workflow artifacts. Pushing a version tag (v0.1.0, matching
# web/package.json) also publishes the DMGs and the Windows installer as a
# GitHub release. Their names carry no version, so
# releases/latest/download/Connector-Foundry-<platform>-<label>.<ext> is a
# stable link.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-15
            platform: mac
            arch: arm64
            artifact: Connector-Foundry-mac-apple-silicon
          - name: macOS (Intel)
            runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: Connector-Foundry-mac-intel
            # GPU-less VM: no WebGL, so the desktop test skips slot placement.
            allow-no-webgl: '1'
          - name: Windows (x64)
            runner: windows-latest
            platform: win
            arch: x64
            artifact: Connector-Foundry-windows-x64-setup
          # Windows on ARM (Snapdragon laptops, Surface Pro). GitHub's ARM
          # runner is a public preview; the x64 build runs there under
          # emulation, so this one is a bonus and must not block a release.
          - name: Windows (ARM64)
            runner: windows-11-arm
            platform: win
            arch: arm64
            artifact: Connector-Foundry-windows-arm64-setup
            experimental: true
            # 7-Zip applies its ARM64 branch filter to arm64 executables by
            # default, which the installer's old Nsis7z plugin cannot decode:
            # the install then silently drops every .exe and .dll. BCJ2 (what
            # the x64 payload gets) it can decode, at a little compression.
            sevenzip-filter: BCJ2
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental == true }}
    defaults:
      run:
        # The same scripts on every runner; Git for Windows provides bash there.
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match web/package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: >-
          npm run desktop:dist -- --${{ matrix.platform }} --${{ matrix.arch }}
          '--config.${{ matrix.platform }}.artifactName=${{ matrix.artifact }}.${ext}'
        env:
          ELECTRON_BUILDER_7Z_FILTER: ${{ matrix.sevenzip-filter }}
      # Windows: run the installer the way a user would (silently, into a
      # scratch folder), and test the app it installed rather than the
      # unpacked build. /D= must come last and takes no quotes.
      # Unsigned Electron binaries are a known Defender false positive
      # (Wacapew and friends); if the installed tree comes up short of its
      # .exe and .dll files, this is where to look.
      - name: Defender status (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          Get-MpComputerStatus | Select-Object AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion | Format-List
          "detections so far: $((Get-MpThreatDetection | Measure-Object).Count)"
          Get-MpThreatDetection | Select-Object -First 10 | Format-List InitialDetectionTime, ThreatID, Resources, ActionSuccess
          Test-Path 'release/win-${{ matrix.arch == 'x64' && '' || format('{0}-', matrix.arch) }}unpacked/Connector Foundry.exe'
      - name: Install (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $setup = Get-Item release/${{ matrix.artifact }}.exe
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          $process = Start-Process -FilePath $setup.FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          "installer exit code: $($process.ExitCode)"
          $exe = Join-Path $target 'Connector Foundry.exe'
          $uninstaller = Join-Path $target 'Uninstall Connector Foundry.exe'
          foreach ($file in $exe, $uninstaller) {
            if (-not (Test-Path $file)) {
              Write-Host "::error::installer did not create $file"
              # Where did it go instead? The scratch folder and the default per-user location.
              foreach ($dir in $env:RUNNER_TEMP, (Join-Path $env:LOCALAPPDATA 'Programs')) {
                "--- $dir"
                Get-ChildItem $dir -Recurse -Depth 1 -ErrorAction SilentlyContinue | Where-Object Name -notlike '*.pak' | Select-Object -First 40 | Format-Table FullName, Length
              }
              "--- Defender detections"
              Get-MpThreatDetection | Select-Object -First 10 | Format-List InitialDetectionTime, ThreatID, Resources, ActionSuccess
              Get-MpThreat | Select-Object -First 10 | Format-List ThreatName, Resources
              exit 1
            }
          }
          (Get-Item $exe).VersionInfo | Format-List ProductName, ProductVersion, FileVersion, CompanyName
          "DESKTOP_EXECUTABLE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test packaged app
        env:
          DESKTOP_ALLOW_NO_WEBGL: ${{ matrix.allow-no-webgl }}
        run: |
          if [ -z "${DESKTOP_EXECUTABLE:-}" ]; then
            shopt -s nullglob
            executables=(release/mac*/Connector\ Foundry.app/Contents/MacOS/Connector\ Foundry release/win*-unpacked/Connector\ Foundry.exe)
            if [ "${#executables[@]}" -ne 1 ]; then
              echo "::error::expected exactly one packaged executable under web/release, found ${#executables[@]}: ${executables[*]}"
              exit 1
            fi
            DESKTOP_EXECUTABLE="${executables[0]}"
          fi
          echo "testing $DESKTOP_EXECUTABLE"
          DESKTOP_EXECUTABLE="$DESKTOP_EXECUTABLE" npm run test:desktop
      # _?= keeps the uninstaller running in place so -Wait really waits.
      - name: Uninstall (Windows)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'installed'
          Start-Process -FilePath (Join-Path $target 'Uninstall Connector Foundry.exe') -ArgumentList '/S', "_?=$target" -Wait
          if (Test-Path (Join-Path $target 'Connector Foundry.exe')) { Write-Host '::error::uninstaller left the app behind'; exit 1 }
          if (Test-Path (Join-Path $target 'resources')) { Write-Host '::error::uninstaller left resources behind'; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            web/release/*.dmg
            web/release/*.zip
            web/release/*.exe
            !web/release/*__uninstaller.exe
          if-no-files-found: error
          retention-days: 14
      # Window screenshots from the packaged-app test, for a look at each
      # platform's title bar without owning a machine that runs it.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Connector-Foundry-*
          path: dist
          merge-multiple: true
      # The macOS ZIPs hold the same app as the DMGs and only matter for
      # auto-update, which the app doesn't do; the blockmap is for the same
      # purpose on Windows. Publishing one file per platform keeps the choice
      # simple.
      - name: Keep only the installers
        run: rm -f dist/*.zip dist/*.blockmap
      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Connector Foundry for macOS and Windows

          **macOS** — download the DMG for your Mac:

          - **Apple Silicon** (M1 and later): `Connector-Foundry-mac-apple-silicon.dmg`
          - **Intel**: `Connector-Foundry-mac-intel.dmg`

          Not sure which? Apple menu → About This Mac: "Chip" means Apple Silicon,
          "Processor" means Intel.

          These builds are not notarized by Apple. On first launch macOS will refuse
          to open the app: open **System Settings → Privacy & Security**, scroll down
          and click **Open Anyway** next to the Connector Foundry message. This is
          only needed once.

          **Windows** (Windows 10 or later): `Connector-Foundry-windows-x64-setup.exe`
          for the usual 64-bit Intel/AMD PCs; `Connector-Foundry-windows-arm64-setup.exe`
          for Windows on ARM (Snapdragon laptops, Surface Pro X), when present.

          The installer is not code-signed, so SmartScreen shows "Windows protected
          your PC" the first time: click **More info**, then **Run anyway**. By
          default it installs for the current user only, without an administrator
          prompt (choosing "all users" asks for one), and can be removed from
          Settings → Apps like any other program.

          Verify downloads against `SHA256SUMS.txt`.

          The web version runs at https://dnnsmnstrr.github.io/connector-foundry/.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Connector Foundry $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
