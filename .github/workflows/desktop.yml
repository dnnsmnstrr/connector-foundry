name: Desktop app

# Manual runs build and test the macOS app and keep the DMG and ZIP as workflow
# artifacts. Pushing a version tag (v0.1.0, matching web/package.json) also
# publishes the DMGs as a GitHub release. Their names carry no version, so
# releases/latest/download/Connector-Foundry-mac-<label>.dmg is a stable link.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    name: macOS (${{ matrix.name }})
    strategy:
      matrix:
        include:
          - arch: arm64
            name: Apple Silicon
            label: apple-silicon
            runner: macos-15
          - arch: x64
            name: Intel
            label: intel
            runner: macos-15-intel
            # GPU-less VM: no WebGL, so the desktop test skips slot placement.
            allow-no-webgl: '1'
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match web/package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: >-
          npm run desktop:dist -- --${{ matrix.arch }}
          '--config.mac.artifactName=Connector-Foundry-mac-${{ matrix.label }}.${ext}'
      - name: Test packaged app
        env:
          DESKTOP_ALLOW_NO_WEBGL: ${{ matrix.allow-no-webgl }}
        run: |
          executables=(release/mac*/Connector\ Foundry.app/Contents/MacOS/Connector\ Foundry)
          DESKTOP_EXECUTABLE="$PWD/${executables[0]}" npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: connector-foundry-mac-${{ matrix.label }}
          path: |
            web/release/*.dmg
            web/release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: connector-foundry-mac-*
          path: dist
          merge-multiple: true
      # The ZIPs hold the same app and only matter for auto-update, which the
      # app doesn't do; publishing just the DMGs keeps the choice simple.
      - name: Keep only the DMGs
        run: rm -f dist/*.zip
      - name: Checksums
        working-directory: dist
        run: sha256sum *.dmg > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Connector Foundry for macOS

          Download the DMG for your Mac:

          - **Apple Silicon** (M1 and later): `Connector-Foundry-mac-apple-silicon.dmg`
          - **Intel**: `Connector-Foundry-mac-intel.dmg`

          Not sure which? Apple menu → About This Mac: "Chip" means Apple Silicon,
          "Processor" means Intel.

          These builds are not notarized by Apple. On first launch macOS will refuse
          to open the app: open **System Settings → Privacy & Security**, scroll down
          and click **Open Anyway** next to the Connector Foundry message. This is
          only needed once. Verify downloads against `SHA256SUMS.txt`.

          The web version runs at https://dnnsmnstrr.github.io/connector-foundry/.
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Connector Foundry $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
