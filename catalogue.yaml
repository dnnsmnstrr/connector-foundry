  # references.yaml checks each part against the designer's files, which
  # sit behind a MakerWorld login: download them and drop them in
  # refs/manual/modgrid/ for those checks to run.
  - id: modgrid/grid
    system: MOD-GRID
    name: Grid
    file: parts/modgrid/grid.scad
    module: modgrid_grid
    confidence: exact
    license: CC-BY-NC-SA-4.0
    source: >-
      MOD-GRID by 3dedc (TinyToolShop), MakerWorld model 2811701 — rebuilt
      from the designer's 4x12 grid STL, measured, and checked against it.
      CC BY-NC-SA 4.0 — see README "Licensing".
    source_url: https://makerworld.com/en/models/2811701-mod-grid
    print_note: >-
      Flat on the bed, no supports. 5mm square holes on an 8mm default pitch
      through a 3mm plate, cols across and rows up. For a nonstandard grid,
      change the hole spacing in Settings → Grid sizes; the holes stay 5mm. By default,
      the panel is cols x 8 + 3 by rows x 8 + 3mm, so 12 x 4 is 99 x 35.
      Accessories plug into two neighbouring holes of a row. "mount" is
      the back, for fusing the grid onto a case or a lid.
    anchors: [bot]
    # parts/modgrid/grid.scad asserts both at least 1.
    minimums:
      cols: 1
      rows: 1
    labels:
      cols: Columns
