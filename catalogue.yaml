  - id: gopro/male
    system: GoPro
    name: Two-prong male buckle
    file: parts/gopro/male.scad
    module: gopro_male
    confidence: exact
    source: GoProScad (ridercz, MIT), vendored
    source_url: https://github.com/ridercz/GoProScad
    print_note: >-
      Legs down; use a brim. Mates with any GoPro three-prong buckle.
      leg_dia is the round leg ends' diameter: the standard 15, from 14
      to 20 for a little less or more material around the bolt; over 17,
      raise leg_h to at least leg_dia so a mating buckle clears the plate.
    minimums:
      leg_dia: 14
    maximums:
      leg_dia: 20
    labels:
      base_h: Base height (mm)
      base_w: Base width (mm)
      leg_h: Prong height (mm)
      leg_dia: Prong end diameter (mm)
    defaults:
      base_h: 3
      base_w: 20
      leg_h: 17
      leg_dia: 15
    variants:
      - name: wide-plate
        params: { base_w: 30 }

  - id: gopro/female
    system: GoPro
    name: Three-prong female buckle
    file: parts/gopro/female.scad
    module: gopro_female
    confidence: exact
    source: GoProScad (ridercz, MIT), vendored
    source_url: https://github.com/ridercz/GoProScad
    print_note: >-
      Legs down; use a brim. outer_w is the far outer leg's width: the
      standard 3mm leg plus a captive pocket for an M5 hex nut in the
      rest. 3 makes all three prongs the same width, with a plain
      through-hole and no pocket. nut_sides 4 with nut_dia 11.5 takes a
      square nut instead. A far leg wider than the near one runs the
      plate further to that side; "mount" sits over the middle prong
      regardless. symmetric pads the near leg to outer_w too, for a
      plate centred on the prongs. leg_dia is the round leg ends'
      diameter: the standard 15, from 14 to 20 for a little less or more
      material around the bolt; over 17, raise leg_h to at least leg_dia
      so a mating buckle clears the plate.
    # Only the far leg is outer_w wide, so the middle prong — where
    # "mount" sits — is (outer_w - 3)/2 off the plate's center, until
    # `symmetric` pads the other leg to match.
    mount_offset:
      y: { param: outer_w, offset: -3, scale: 0.5, unless: symmetric }
    # The far leg is never narrower than the other prongs (GP_LEG_T,
    # asserted in parts/gopro/female.scad): 3 is the equal-prongs buckle.
    minimums:
      outer_w: 3
      leg_dia: 14
    maximums:
      leg_dia: 20
    labels:
      base_h: Base height (mm)
      base_w: Base width (mm)
      leg_h: Prong height (mm)
      leg_dia: Prong end diameter (mm)
      outer_w: Outer prong width (mm)
      nut_sides: Nut sides
      nut_dia: Nut size across corners (mm)
    defaults:
      base_h: 3
      base_w: 20
      leg_h: 17
      leg_dia: 15
      outer_w: 6
      nut_sides: 6
      nut_dia: 9.5
      symmetric: false
    variants:
      - name: equal-prongs
        params: { outer_w: 3 }
      - name: square-nut
        params: { nut_sides: 4, nut_dia: 11.5 }
      - name: symmetric
        params: { symmetric: true }

