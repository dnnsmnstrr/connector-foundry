# Single source of truth for what exists. The CLI, the tests, the web app
# and the generated README all read this file — adding a part means adding
# a .scad file and one entry here.
#
# confidence:
#   exact       — the geometry comes from, or is checked against, a
#                 reference implementation of the standard. Every part at
#                 this level has entries in references.yaml, and
#                 `make verify` re-proves the claim.
#   parametric  — a starting point. Verify against real hardware.
#   unverified  — worse than parametric: a starting point that is known
#                 or strongly suspected to be dimensionally wrong, kept
#                 in the catalogue for the module/slot scaffolding but
#                 not fit to print. Say why in print_note, and say what
#                 the real fix is (usually: import the real part — see
#                 web/src/lib/importedPart.js — rather than guess again).
#   imported    — never written here. It's what the web Bench labels a
#                 part a user dragged in via STL import at runtime: "we
#                 didn't derive this, the user brought it." Session-
#                 local, never persisted to this file — see the Bench
#                 "Licensing/hygiene" note in web/README.md.
#
# options: for a parameter whose values are a fixed set, list them. The
#   web app turns those into a dropdown instead of a free-text box, and
#   the CLI rejects a value that is not on the list — so nobody has to
#   remember that a board variant is spelled "lite" and its chamfers are
#   spelled "Corners". A test holds `options` and `defaults` together.
#
# license: omitted means the repository's MIT licence. A part that calls
#   into a vendored upstream carries that upstream's terms instead — see
#   the README "Licensing" section. This field is not decoration: it is
#   what a downstream user has to read before shipping a part.
#
# slots: for a part with enough surface area to place something off-
#   centre, its "mount_<i>_<j>" anchor grid — see lib/slots.scad's
#   grid_mount_anchors(). `pitch` (mm) is always required.
#   `count_params`, if present, names the two current parameters whose
#   values ARE the slot count on each axis (e.g. openGrid: one slot per
#   cell, so count is exactly [cells_x, cells_y] — an even cell count
#   has no center cell, so those indices land on half-integers, which
#   is correct, not a bug). Omit `count_params` when the grid is a free
#   subdivision instead of tied to a specific feature (e.g. Gridfinity):
#   the web editor then derives the nearest-odd count from the part's
#   own rendered bounding box ÷ pitch, same formula as slot_count() in
#   lib/slots.scad. tests/test_slots.py renders and probes the grid
#   either way, so this can't drift from the geometry.
#
# side_slots: for a part with a row of anchors along one or more of its
#   side faces, not just the top grid `slots` covers — see
#   lib/slots.scad's side_row_anchors() and
#   parts/basics/pinhole_plate.scad. `pitch` (mm) is required; `faces`
#   lists one entry per side face that can carry a row, each naming the
#   anchor prefix ("<name>_<i>"), the boolean parameter that turns that
#   face's row on or off (`enabled_param`), and the current parameter
#   whose value is that row's anchor count (`count_param`, e.g. a
#   plate's own grid_y for its xpos/xneg rows, since a row along an edge
#   has as many anchors as the top grid has in that direction). A face
#   with no row in the current instance (enabled_param is false) simply
#   contributes no anchors, same as a face with side_holes off has none
#   to click.
#
# anchors: for a part with named anchors beyond the default "mount" on
#   its own faces — see parts/basics/plate.scad and post.scad — the
#   list of which of "bot"/"xpos"/"xneg"/"ypos"/"yneg" it declares.
#   Every name here sits at the exact center of that face of the part's
#   own rendered bounding box, so the web editor derives its position
#   the same way for any part, without parsing the .scad: no formula to
#   restate here, just which faces exist. Mutually exclusive with
#   `slots` in this catalogue (a part either has a handful of fixed
#   named faces or a pitched grid, never both) — nothing stops a part
#   from declaring both if a future one legitimately needs to.
parts:
  - id: gridfinity/base
    system: Gridfinity
    name: Bin base
    file: parts/gridfinity/base.scad
    module: gf_base
    confidence: exact
    source: "Wraps gridfinity-rebuilt-openscad (kennetek, MIT), vendored at vendor/gridfinity-rebuilt"
    print_note: Print as-is, functional face (feet) down. No supports needed.
    slots:
      pitch: 14  # GRID_DIMENSIONS_MM.x / 3 — a free subdivision, not tied to a specific feature
    defaults:
      gx: 1
      gy: 1
      magnets: false
      screws: false
    variants:
      - name: with-magnets
        params: { magnets: true }
      - name: with-magnets-and-screws
        params: { magnets: true, screws: true }
      - name: 2x2-corners-only
        params: { gx: 2, gy: 2, magnets: true, only_corners: true }
      - name: thumbscrew
        params: { thumbscrew: true }

  - id: gopro/male
    system: GoPro
    name: Two-prong male buckle
    file: parts/gopro/male.scad
    module: gopro_male
    confidence: exact
    source: "Wraps GoProScad (ridercz, MIT), vendored at vendor/GoProScad"
    print_note: >-
      Legs face down for slot consistency; use a brim for first-layer
      adhesion. Mates with any GoPro-standard three-prong buckle — proved
      against the upstream model, not just against our own female.
    defaults:
      base_h: 3
      base_w: 20
      leg_h: 17
    variants:
      - name: wide-plate
        params: { base_w: 30 }

  - id: gopro/female
    system: GoPro
    name: Three-prong female buckle
    file: parts/gopro/female.scad
    module: gopro_female
    confidence: exact
    source: "Wraps GoProScad (ridercz, MIT), vendored at vendor/GoProScad"
    print_note: >-
      Legs face down for slot consistency; use a brim for first-layer
      adhesion. nut_depth sinks a captive square-nut pocket in the far
      leg; set it to 0 for a plain through-hole.
    defaults:
      base_h: 3
      base_w: 20
      leg_h: 17
      nut_depth: 3
    variants:
      - name: no-nut-pocket
        params: { nut_depth: 0 }

  - id: extrusion2020/tab
    system: 2020 Extrusion
    name: T-slot tab (hammer-head)
    file: parts/extrusion2020/tab.scad
    module: ex_tab
    confidence: parametric
    source: >-
      20-series slot geometry measured off NopSCADlib's E2020t
      (GPL-3.0 — measured against, not vendored); see references.yaml
    print_note: >-
      Supplier-dependent — check EX_* in lib/constants.scad against your
      rail. Head flanks are chamfered at EX_FLOOR_ANGLE to follow the
      channel floor. tab_len <= 6mm (the default) drops into the slot
      face-first and twists 90 degrees to lock, anywhere along the rail;
      longer heads must be fed in endwise from an open end.
    defaults:
      tab_len: 6
      head_t: 2.0
      shaft_len: 8
    variants:
      - name: end-feed-length
        params: { tab_len: 16 }

  - id: extrusion2020/clip
    system: 2020 Extrusion
    name: Snap-in clip
    file: parts/extrusion2020/clip.scad
    module: ex_clip
    confidence: parametric
    source: >-
      20-series slot geometry measured off NopSCADlib's E2020t
      (GPL-3.0 — measured against, not vendored); see references.yaml
    print_note: >-
      Supplier-dependent — check EX_* in lib/constants.scad against your
      rail. Push straight into the slot mid-rail, no end access needed;
      the legs flex through EX_SLOT_OPEN and the barbs spring out under
      the lip. Print in a flexible-enough filament (PETG/nylon) — stiff
      PLA legs may snap.
    defaults:
      leg_len: 7
      post_h: 8

  - id: extrusion2020/endcap
    system: 2020 Extrusion
    name: End-face plate
    file: parts/extrusion2020/endcap.scad
    module: ex_endcap
    confidence: parametric
    source: >-
      20-series slot geometry measured off NopSCADlib's E2020t
      (GPL-3.0 — measured against, not vendored); see references.yaml
    print_note: >-
      Supplier-dependent — check EX_* in lib/constants.scad against your
      rail. Locating keys print face-down as oriented; the plate
      overhangs them at its four corners, so add a brim or light support
      there.
    defaults:
      plate_t: 3
      boss_h: 2

  - id: extrusion2020/corner-bracket
    system: 2020 Extrusion
    name: Corner bracket
    file: parts/extrusion2020/corner-bracket.scad
    module: ex_corner_bracket
    confidence: parametric
    source: >-
      20-series slot geometry measured off NopSCADlib's E2020t
      (GPL-3.0 — measured against, not vendored); see references.yaml
    print_note: >-
      Supplier-dependent — check EX_* in lib/constants.scad against your
      rail. Print with the base flange down as oriented; the upright
      flange is a self-supporting 90 degree wall. Bore centers assume the
      bracket sits centered on each extrusion face — check against your
      T-nut/bore spacing.
    defaults: {}

  - id: extrusion2020/c-clip
    system: 2020 Extrusion
    name: Profile C-clip
    file: parts/extrusion2020/c-clip.scad
    module: ex_c_clip
    confidence: parametric
    source: >-
      20-series slot geometry measured off NopSCADlib's E2020t
      (GPL-3.0 — measured against, not vendored); see references.yaml
    print_note: >-
      Supplier-dependent — check EX_* in lib/constants.scad against your
      rail. Snaps over the OUTSIDE of the extrusion through its open
      side; print with the ring axis vertical as oriented (zero overhang
      either way up). Confirm your printer's flex/tolerance can open the
      gap without cracking.
    defaults: {}

  - id: opengrid/board
    system: openGrid
    name: Mounting board
    file: parts/opengrid/board.scad
    module: og_board
    confidence: exact
    license: CC-BY-NC-SA-4.0
    source: >-
      Wraps QuackWorks openGrid.scad, vendored at vendor/QuackWorks.
      openGrid design by David D; OpenSCAD implementation by Andy
      (BlackjackDuck). NOT MIT — see README "Licensing".
    print_note: >-
      Grid face up, flat on the bed. A tile is exactly cells x 28mm, so
      boards butt against each other with no border. "full" is the
      default; "lite" is 4mm, "heavy" is 13.8mm. The heavy tile is two
      halves back to back with a deliberate gap between them, so it
      contains one sealed cavity per cell — expected, not a modelling
      error, but it does mean the interior is unreachable once printed.
    slots:
      pitch: 28  # OG_PITCH — one slot per cell
      count_params: [cells_x, cells_y]
    defaults:
      cells_x: 2
      cells_y: 2
      variant: full
      chamfers: "None"
      connector_holes: false
      screw_mounting: "None"
    options:
      variant: [full, lite, heavy]
      # Spelling and capitalisation are upstream's, passed through
      # verbatim — openGrid.scad compares these strings directly.
      chamfers: ["None", Corners, Everywhere]
      screw_mounting: ["None", Corners, Everywhere, "By Row and Column"]
    variants:
      - name: lite-1x1
        params: { cells_x: 1, cells_y: 1, variant: lite }
      - name: heavy
        params: { variant: heavy }
      - name: full-2x2-finished
        params: { chamfers: Corners, connector_holes: true, screw_mounting: Corners }

  - id: opengrid/snap
    system: openGrid
    name: Cell snap
    file: parts/opengrid/snap.scad
    module: og_snap
    confidence: exact
    license: CC-BY-NC-SA-4.0
    source: >-
      Wraps QuackWorks opengrid-snap.scad, vendored at vendor/QuackWorks.
      openGrid design by David D; snap implementation by metasyntactic.
      NOT MIT — see README "Licensing".
    print_note: >-
      Print in a material with some flex (PETG/PLA+) so the retaining
      wings can compress; no supports needed. A snap sits within the
      board's thickness. Note the "lite" snap is a half-height snap
      (3.4mm), which is not the same thing as a lite tile (4.0mm).
    defaults:
      variant: full
      directional: false
    options:
      variant: [full, lite]
    variants:
      - name: lite
        params: { variant: lite }
      - name: directional
        params: { directional: true }

  - id: basics/plate
    system: Basics
    name: Flat plate
    file: parts/basics/plate.scad
    module: basics_plate
    confidence: exact
    source: "Generic geometry, not tied to an external spec — nothing to check it against"
    print_note: >-
      Flat on the bed, no supports needed. Named anchors on all 6 faces —
      branch composition off any side, not just top/bottom.
    anchors: [bot, xpos, xneg, ypos, yneg]
    defaults:
      w: 40
      d: 40
      t: 4
      r: 3
    variants:
      - name: with-bolts
        params: { bolts: true }

  - id: basics/post
    system: Basics
    name: Round post
    file: parts/basics/post.scad
    module: basics_post
    confidence: exact
    source: "Generic geometry, not tied to an external spec — nothing to check it against"
    print_note: Stands upright on its "bot" anchor (flat end down), no supports needed.
    anchors: [bot]
    defaults:
      dia: 10
      h: 20
    variants:
      - name: bored
        params: { bore: 4 }

  - id: basics/dovetail_rail
    system: Basics
    name: Dovetail rail
    file: parts/basics/dovetail_rail.scad
    module: dovetail_rail
    confidence: exact
    source: "Generic geometry, not tied to an external spec — nothing to check it against"
    print_note: >-
      Tip down, no supports needed — the taper narrows going down. Was
      originally a guess at DeckMate's dimensions; confirmed wrong
      against a real DeckMate part, so it lives here as a generic
      dovetail instead. For a part that actually mates with a DeckMate
      accessory, import the real Mechanism model into the web Bench.
    defaults:
      rail_len: 36
      end_stop: false
    variants:
      - name: with-end-stop
        params: { end_stop: true }

  - id: basics/dovetail_channel
    system: Basics
    name: Dovetail channel
    file: parts/basics/dovetail_channel.scad
    module: dovetail_channel
    confidence: exact
    source: "Generic geometry, not tied to an external spec — nothing to check it against"
    print_note: >-
      Mouth down, no supports needed — the channel widens going up.
      Mates with basics/dovetail_rail; see its print note for why this
      isn't in DeckMate.
    defaults:
      rail_len: 36
      wall: 2.4
      clearance: 0.3

  - id: bitbeam/beam
    system: BitBeam
    name: Beam
    file: parts/bitbeam/beam.scad
    module: bitbeam_beam
    confidence: exact
    license: BSD-3-Clause
    source: >-
      Dimensions from bitbeam.cc's published spec (checked 2026-09-02;
      that site's own content is CC-BY-NC-SA and not used here — see
      lib/constants.scad). Geometry from vendor/bitbeam-lib
      (ondratu/bitbeam-lib, BSD-3-Clause), a separately and permissively
      licensed OpenSCAD implementation by bitbeam.cc's own author, whose
      defaults already match the published spec.
    print_note: >-
      Print flat, no supports or brim needed. Holes run through top/
      bottom on 8mm pitch, and — with side_holes on, the default —
      through front/back too, so beams can join at a right angle as
      well as end to end. LEGO Technic-compatible.
    defaults:
      len: 5
      side_holes: true

  - id: bitbeam/pin
    system: BitBeam
    name: Friction pin
    file: parts/bitbeam/pin.scad
    module: bitbeam_pin
    confidence: exact
    source: >-
      Dimensions from bitbeam.cc's published spec, checked 2026-09-02 —
      see lib/constants.scad — with no reference geometry to check
      against: nobody publishes a CAD model of just a pin, only the
      numbers.
    print_note: >-
      Prints standing up, no supports needed. Grips a beam's hole by
      interference, not a snug published tolerance — how oversized it
      needs to be depends on filament and printer, same caveat
      bitbeam.cc's own docs give. Tune FIT_CLEARANCE (Settings in the
      web app) rather than the diameter directly: more for a firmer
      grip, less (even negative) for an easier push.
    defaults:
      dia: 4.6
      len: 4

  - id: bitbeam/shaft
    system: BitBeam
    name: Axle shaft
    file: parts/bitbeam/shaft.scad
    module: bitbeam_shaft
    confidence: exact
    source: >-
      Dimensions from bitbeam.cc's published spec, checked 2026-09-02 —
      see lib/constants.scad — with no reference geometry to check
      against: nobody publishes a CAD model of just a shaft, only the
      numbers.
    print_note: >-
      Prints standing up, no supports needed. Sized to spin freely in a
      beam's hole (a wheel/gear axle, not a fixed grip — for that, use
      bitbeam/pin instead). Tune FIT_CLEARANCE (Settings in the web app)
      for how much play it has: more clearance for a freer spin, less
      for a snugger one.
    defaults:
      dia: 4.3
      len: 3.6

  - id: basics/pinhole_plate
    system: Basics
    name: Pinhole plate
    file: parts/basics/pinhole_plate.scad
    module: pinhole_plate
    confidence: exact
    source: >-
      Hole size and pitch from bitbeam.cc's published spec, checked
      2026-09-02 — see lib/constants.scad — with no reference geometry
      to check against: nobody publishes a CAD model of a plate like
      this, only the numbers a real BitBeam hole has to match.
    print_note: >-
      Flat on the bed, no supports needed. Every hole (top grid and side
      rows alike) is a fixed 4.8mm bore, same as a real beam's — fit is
      tuned entirely on the pin (bitbeam/pin's FIT_CLEARANCE), not here.
      Side holes need real wall around them: the default thickness
      (8mm) is what keeps that sane and keeps the side rows in register
      with the top grid; go thinner and side_xpos/side_xneg/side_ypos/
      side_yneg have to come off, or the render refuses outright rather
      than emit an undersized bore.
    slots:
      pitch: 8
      count_params: [grid_x, grid_y]
    side_slots:
      pitch: 8
      faces:
        - { name: xpos, enabled_param: side_xpos, count_param: grid_y }
        - { name: xneg, enabled_param: side_xneg, count_param: grid_y }
        - { name: ypos, enabled_param: side_ypos, count_param: grid_x }
        - { name: yneg, enabled_param: side_yneg, count_param: grid_x }
    anchors: [bot, xpos, xneg, ypos, yneg]
    defaults:
      grid_x: 3
      grid_y: 3
      t: 8
      r: 3
      side_xpos: true
      side_xneg: true
      side_ypos: true
      side_yneg: true
