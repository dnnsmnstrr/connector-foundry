  - id: modgrid/connector
    system: MOD-GRID
    name: Pin
    file: parts/modgrid/connector.scad
    module: modgrid_connector
    confidence: parametric
    license: CC-BY-NC-SA-4.0
    source: >-
      MOD-GRID by 3dedc (TinyToolShop), MakerWorld model 2811701 — the
      compliant style is the designer's "Modular connector", reshaped so
      its legs bend instead of breaking and checked to fit the designer's
      grid. The dowel and BitBeam styles are fit prototypes for user testing;
      the BitBeam fork follows its published pin guide, also CC BY-NC-SA 4.0.
      CC BY-NC-SA 4.0 — see README "Licensing".
    source_url: https://makerworld.com/en/models/2811701-mod-grid
    keywords: [snap, connector, dowel, screw, bitbeam, fork]
    print_note: >-
      The snap pin MOD-GRID accessories plug in with, for fusing onto any
      part so it plugs into a MOD-GRID grid; on the Bench it attaches with
      plate 0, the pegs straight on the part's face. pegs 2 is the 2x1
      pin, for two neighbouring holes of a row; pegs 1 a single peg for
      one hole. rows repeats them in that many rows; depth is how deep
      each goes along its 5mm hole (4.8). style selects compliant spring
      legs, the screw-expanded dowel prototype, or the 4mm BitBeam-style
      forked square pin. screw_diameter tunes the dowel's tapered bore
      (1.5–2.6mm); start with a screw near that major diameter. On its own,
      plate puts a carrier behind the pins. The compliant style snaps in
      and stays pressed on the hole's back edge. Print the compliant pegs
      on their side, their profile flat on the bed; print either prototype
      carrier-down with the pins upright, or rotate it for stronger layer
      direction if the printer needs it.
    attached_defaults:
      plate: 0
    # The compliant style asserts these: a peg's two 1mm tip roundings need
    # 2mm of depth, and the hole is 5mm (4.8 leaves 0.1mm either side).
    maximums:
      depth: 5
      screw_diameter: 2.6
    labels:
      depth: Peg depth (mm)
      plate: Plate thickness (mm)
      screw_diameter: Screw diameter (mm)
    defaults:
      pegs: 2
      rows: 1
      depth: 4.8
      plate: 1.5
      style: compliant
      screw_diameter: 2.0
    options:
      pegs: [1, 2]
      style: [compliant, dowel, bitbeam]
    minimums:
      rows: 1
      depth: 2
      plate: 0
      screw_diameter: 1.5
    # A set of pegs per 8mm row. No handle for plate: a handle stops
    # short of 0, which is the plate this part has on the Bench.
    resize:
      y: { param: rows, per: 8, step: 1, max: 12 }
    variants:
      - name: single
        params: { pegs: 1 }
      - name: two-rows
        params: { rows: 2 }
      - name: depth-4.9
        params: { depth: 4.9 }
      - name: dowel-2mm
        params: { style: dowel, screw_diameter: 2.0 }
      - name: dowel-2.5mm
