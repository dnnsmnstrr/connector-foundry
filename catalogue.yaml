  - id: hsw/wall
    system: Honeycomb Storage Wall
    name: Wall panel
    file: parts/hsw/wall.scad
    module: hsw_wall
    confidence: exact
    license: CC-BY-4.0
    source: >-
      Honeycomb Storage Wall by RostaP; each cell is halfhex() from geru's
      3d-scad-hsw-customizable (after Xander and EdwinEesting, CC-BY 4.0),
      vendored, laid out to match its own grid().
    source_url: https://github.com/geru/3d-scad-hsw-customizable
    print_note: >-
      Front face on the bed (the 20mm openings), no supports. Columns are
      rows cells tall, every other one half a cell lower. flat_edges trims
      the panel to a rectangle with a flat wall all round, so panels butt
      together; the end columns are then half cells. "mount" is the back,
      against the wall.
    anchors: [bot]
    # parts/hsw/wall.scad asserts both at least 1 (flat_edges: 2).
    minimums:
      cols: 1
      rows: 1
    labels:
      cols: Columns
    defaults:
      cols: 4
      rows: 3
      flat_edges: false
    # Columns are 1.5 cell sides (23.6 / sqrt(3)) apart, cells 23.6 apart
    # in a column. A second column hangs half a cell lower and adds 11.8mm
    # to Y, so the handle keeps two: below that, X would move Y. With
    # flat_edges, rows 1 is a render error. 16 x 14 (334 x 342mm) renders
    # in 0.6s natively and 1.1s in the browser.
    resize:
      x: { param: cols, per: 20.4382, step: 1, min: 2, max: 16 }
      y: { param: rows, per: 23.6, step: 1, max: 14 }
    variants:
      - name: flat-edges
        params: { cols: 5, rows: 4, flat_edges: true }

