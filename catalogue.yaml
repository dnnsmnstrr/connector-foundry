  - id: modgrid/bit_holder
    system: MOD-GRID
    name: Bit holder
    file: parts/modgrid/bit_holder.scad
    module: modgrid_bit_holder
    confidence: exact
    license: CC-BY-NC-SA-4.0
    source: >-
      MOD-GRID by 3dedc (TinyToolShop), MakerWorld model 2811701 — the
      designer's 4mm, 6mm and Leatherman flat bit holders, rebuilt from
      their v4 STLs, measured, and checked against them, on the reshaped
      pin of the MOD-GRID pin part. CC BY-NC-SA 4.0 — see README
      "Licensing".
    source_url: https://makerworld.com/en/models/2811701-mod-grid
    print_note: >-
      Holds driver bits on a MOD-GRID grid: bit 4mm takes three 4mm hex
      precision bits, 6mm two 1/4" (6.35mm) hex bits, leatherman three
      Leatherman flat bits. The bits lie along the holder and slide in
      from an end. rows makes it that many grid rows long, 8mm and a pin
      each, to hold longer bits further along. Print it on its side, an
      end face on the bed, as the designer does; no supports.
    # parts/modgrid/bit_holder.scad asserts it.
    minimums:
      rows: 1
    labels:
      bit: Bit size
    defaults:
      bit: "4mm"
      rows: 1
    options:
      bit: ["4mm", "6mm", leatherman]
    # 8mm and a pin per row.
    resize:
      y: { param: rows, per: 8, step: 1, max: 8 }
    variants:
      - name: 6mm
        params: { bit: "6mm" }
      - name: leatherman
        params: { bit: leatherman }
      - name: 4mm-two-rows
        params: { rows: 2 }

  - id: soldr/base
    system: SOLDR
    name: Module base
    file: parts/soldr/base.scad
    module: soldr_base
    confidence: exact
    license: CC-BY-NC-SA-4.0
    source: >-
      SOLDR by soldr.pro, Printables model 1471127 — rebuilt from the
      designer's 1x1 and 1x2 module STLs, measured, and checked against
      them. CC BY-NC-SA 4.0 — see README "Licensing".
    source_url: https://www.printables.com/model/1471127-soldr-modular-usb-c-powered-soldering-station
    print_note: >-
      Feet down, no supports. One tapered foot per unit on a 30.5mm pitch
      under a 1mm plate: a base is exactly units x 30.5 - 1.7mm each way and
      3mm tall, so the designer's 1x2 is 28.8 x 59.3. magnets two is the
      designer's pair of 6mm magnets per unit; one puts a single magnet in
      the middle of each, four puts four in each, every hole 15.25mm from
      the next both ways. The holes are open at the top:
      press the magnets in before anything covers them (fused onto a part,
      pause the print at 3mm).
    holes_guides: { inset: 0, radius: 10.2 }
    slots:
      pitch: 30.5  # SOLDR_PITCH — one slot per unit
      count_params: [gx, gy]
      center: true  # and one in the middle from 2 x 2 up
    # parts/soldr/base.scad asserts both at least 1.
    minimums:
      gx: 1
      gy: 1
    # 2 x 1 by default: test_slots.py walks from one slot to its X
    # neighbour, and a 1 x 1 base has one slot.
    labels:
      gx: Width (units)
      gy: Depth (units)
    defaults:
      gx: 2
      gy: 1
      magnets: two
    options:
      magnets: [one, two, four, none]
    # A unit per 30.5mm each way. 4 x 4 renders in 3.6s in the browser
    # (0.6s natively); 8 x 8 takes 11s there.
    resize:
      x: { param: gx, per: 30.5, step: 1, max: 4 }
      y: { param: gy, per: 30.5, step: 1, max: 4 }
    variants:
      - name: 1x1
        params: { gx: 1 }
      - name: 2x2-four-magnets
        params: { gx: 2, gy: 2, magnets: four }
      - name: one-magnet
        params: { magnets: one }
      - name: no-magnets
        params: { magnets: none }

  - id: molle/spine
    system: MOLLE
    name: Spine
    file: parts/molle/spine.scad
    module: molle_spine
    confidence: parametric
    source: >-
      lib/molle.scad, from the PALS grid as the webbing defines it: 25.4mm
      (1") rows with a 25.4mm gap, bar-tacked every 38.1mm (1.5"). No
      published geometry drawing or open model to check against.
    source_url: https://en.wikipedia.org/wiki/Pouch_Attachment_Ladder_System
    print_note: >-
      Print it on its side, the profile flat on the bed, so the layers run
      along the tongue; PETG flexes better than PLA. Slide the tongue down
      behind rows rows of webbing from above, until the barb clicks in under
      the bottom row; press the tip back to take it off. cols 2 puts two
      tongues 38.1mm apart, for two columns, so the part cannot swing.
      webbing is the gap the webbing sits in: measure yours, and go tighter
      for a firmer grip. The plate's front is "mount".
    minimums:
      rows: 1
      cols: 1
      webbing: 1
      plate: 1.5
    labels:
      cols: Columns
      webbing: Webbing gap (mm)
      plate: Plate thickness (mm)
    defaults:
      rows: 2
      cols: 1
      webbing: 2
      plate: 3
    # A tongue per PALS column (38.1mm), a PALS row pitch (50.8mm) per
    # row. 9 x 7 (339 x 344mm) renders in 0.4s natively, 0.3s in the
    # browser.
    resize:
      x: { param: cols, per: 38.1, step: 1, max: 9 }
      y: { param: rows, per: 50.8, step: 1, max: 7 }
    variants:
      - name: two-cols
        params: { cols: 2 }
      - name: one-row
        params: { rows: 1 }

  - id: molle/panel
    system: MOLLE
    name: Panel
    file: parts/molle/panel.scad
    module: molle_panel
    confidence: parametric
    source: >-
      lib/molle.scad: a laser-cut MOLLE panel's slits, every 25.4mm up and
      38.1mm across, with a channel behind each column for the strap. No
      published geometry drawing or open model to check against.
    source_url: https://en.wikipedia.org/wiki/Pouch_Attachment_Ladder_System
    print_note: >-
      Front down, ribs up, no supports. A pouch strap goes in at one slit,
      behind the strip, out at the next; the 30 x 5mm slits take a 1" strap,
      and channel is the room behind the skin for it to run in (0 for a
      bare slotted skin). rows counts strips, rows + 1 rows of slits. A
      panel is exactly cols x 38.1 by (rows + 1) x 25.4mm, so panels butt
      together. "mount" is the back.
    anchors: [bot]
    minimums:
      cols: 1
      rows: 1
      channel: 0
    labels:
      cols: Columns
      channel: Strap channel depth (mm)
    defaults:
      cols: 3
      rows: 4
      channel: 3
    # 9 x 12 (343 x 330mm) renders in 0.4s natively, 0.9s in the browser.
    resize:
      x: { param: cols, per: 38.1, step: 1, max: 9 }
      y: { param: rows, per: 25.4, step: 1, max: 12 }
    variants:
      - name: flat
        params: { channel: 0 }
      - name: 2x6
        params: { cols: 2, rows: 6 }

  - id: molle/rigid_panel
    system: MOLLE
    name: Rigid panel
    file: parts/molle/rigid_panel.scad
    module: molle_rigid_panel
    confidence: parametric
    source: >-
      lib/molle.scad: rigid panels have no standard; the default opening is
      DV8 Offroad's published 1.5" x 1" (38.1 x 25.4mm), on PALS spacing up
      and a 12.7mm bar across. No open model to check against.
    source_url: https://nomadicsupply.com/dv8-offroad-universal-molle-panel-23x15-unmp-06/
    print_note: >-
      Flat on the bed, no supports. Open windows that pouch straps wrap
      round and molle/insert plugs into. cols x rows openings, each open_w x
      open_h with open_r corners, centred in pitch_x x pitch_y cells: a
      panel is exactly cols x pitch_x by rows x pitch_y, so panels butt
      together. The openings are 0.5mm over the nominal 38.1 x 25.4, since
      printed holes come out narrow; a molle/insert at its defaults has
      0.3mm a side. To match a truck panel, measure its openings and the
      distance between their centres. Mounting holes come from the Holes
      tab. "mount" is the back.
    anchors: [bot]
    minimums:
      cols: 1
      rows: 1
      open_r: 0
      thickness: 1
    labels:
      cols: Columns
      open_w: Opening width (mm)
      open_h: Opening height (mm)
      open_r: Opening corner radius (mm)
      pitch_x: Cell width (mm)
      pitch_y: Cell height (mm)
      thickness: Thickness (mm)
    defaults:
      cols: 4
      rows: 3
      open_w: 38.6
      open_h: 25.9
      open_r: 3
      pitch_x: 50.8
      pitch_y: 50.8
      thickness: 4
    # Only the thickness: the panel's X and Y step by pitch_x and pitch_y,
    # which are parameters themselves.
    resize:
      z: { param: thickness }
    variants:
      - name: tight-grid
        params: { open_w: 38.6, open_h: 32.25, pitch_x: 50.8, pitch_y: 44.45 }

  - id: molle/insert
    system: MOLLE
    name: Panel insert
    file: parts/molle/insert.scad
    module: molle_insert
    confidence: parametric
    source: >-
      lib/molle.scad's rigid-panel opening: a base plate behind the panel
      and a boss that fits the opening, a tenth under its nominal 38.1 x
      25.4. Rigid panels have no standard, so the boss and the panel's
      thickness are parameters.
    source_url: https://nomadicsupply.com/dv8-offroad-universal-molle-panel-23x15-unmp-06/
    print_note: >-
      Base down, boss up, no supports. boss_w x boss_h is the part that goes
      into the opening: 38 x 25.3 by default, a tenth under a real panel's
      nominal 1.5" x 1" and 0.3mm a side clear of molle/rigid_panel's
      printed opening. For another panel, measure its opening and take a
      little off. panel_t is its thickness (2mm for a typical steel panel,
      4 for molle/rigid_panel's default); the boss stands 0.2mm short of
      the panel's front, so a bolted part clamps the panel. The base goes in from behind the panel. hole drills
      one centre through-hole; for heat-set inserts, nut traps or a grid of
      holes, use the Holes tab on the boss face. "mount" is the boss face.
    anchors: [bot]
    minimums:
      boss_r: 0
      panel_t: 0.5
      margin: 1
      base: 1
      hole: 0
    labels:
      boss_w: Boss width (mm)
      boss_h: Boss height (mm)
      boss_r: Boss corner radius (mm)
      panel_t: Panel thickness (mm)
      margin: Base margin (mm)
      base: Base thickness (mm)
      hole: Centre hole diameter (mm)
    defaults:
      boss_w: 38
      boss_h: 25.3
      boss_r: 3
      panel_t: 2
      margin: 6
      base: 3
      hole: 0
    variants:
      - name: center-hole
        params: { hole: 5.5 }
      - name: printed-panel
        params: { panel_t: 4 }

