    variants:
      - name: three-units
        params: { units: 3 }

  - id: skadis/board
    system: Skådis
    name: Board
    file: parts/skadis/board.scad
    module: skadis_board
    confidence: exact
    source: >-
      lib/skadis.scad: Skådis's 5 x 15mm slots in a checkerboard on a 20mm
      grid, checked against breckenedge's parametric-skadis-tower (CC-BY-SA
      4.0, measured against, not vendored).
    source_url: https://github.com/breckenedge/parametric-skadis-tower
    print_note: >-
      Flat on the bed, no supports. 5mm thick, slots 40mm apart along a row
      and rows 20mm apart, every other row shifted 20mm, as on a Skådis
      board; cols counts the slots in a row, in halves: 2.5 is five 20mm
      cells across, which makes the board symmetric left to right (a whole
      number leaves one side starting on a gap). The slots are cut 5.2mm wide,
      so moulded Skådis hooks go in. A board is exactly 2 x cols x rows
      20mm cells, so boards butt together. "mount" is the back, against the
      wall.
    anchors: [bot]
    # parts/skadis/board.scad asserts both at least 1. Without it the
    # cols handle would stop at one 0.5 step, which the assert refuses.
    minimums:
      cols: 1
      rows: 1
    labels:
      cols: Columns
    defaults:
      cols: 2
      rows: 4
    # A column is two 20mm cells. 8 x 16 (320mm square) renders in 0.6s
    # natively and 1.1s in the browser.
    resize:
      x: { param: cols, per: 40, step: 0.5, max: 8 }
      y: { param: rows, per: 20, step: 1, max: 16 }
    variants:
      - name: 3x6
        params: { cols: 3, rows: 6 }
      - name: symmetric
        params: { cols: 2.5, rows: 5 }

