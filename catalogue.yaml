    print_note: >-
      The plate every GOEWS accessory hangs by, for fusing onto any part so
      it hangs on a GOEWS tile; "mount" is the plate's front, the hangers'
      flat bottom edge down. units puts that many hangers side by side, one
      per cell of a row; plate is the plate's thickness (3). Push a hanger
      into the top of a cell's window and drop it onto the cleats; a GOEWS
      bolt through the notch above it locks it there. Print it on its side,
      a long edge on the bed, so the layers run along the hangers.
    attached_up: [0, 1]
