[project]
name = "connector-foundry"
version = "0.1.0"
description = "Parametric, printable mounting interfaces (Gridfinity, openGrid, GoPro, DeckMate, 2020 extrusion) in OpenSCAD"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "trimesh>=4.0",
    "numpy>=1.26",
    "networkx>=3.0",
]

[project.optional-dependencies]
# scipy: nearest-point queries behind the surface-distance metric, and
#        the section/traversal code trimesh defers to it for.
# shapely: 2D boolean area on cross-sections.
# cascadio: STEP -> mesh, for supplier CAD references (see references.yaml).
dev = [
    "pytest>=8.0",
    "rtree>=1.0",
    "scipy>=1.11",
    "shapely>=2.0",
    "cascadio>=0.0.14",
]

[project.scripts]
foundry = "foundry:app"

[tool.setuptools]
py-modules = ["foundry"]
package-dir = { "" = "cli" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
